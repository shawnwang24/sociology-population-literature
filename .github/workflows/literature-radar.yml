name: Sociology & Demography Literature Radar

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只生成报告，不发邮件、不更新去重状态"
        required: true
        default: true
        type: boolean
  schedule:
    # 每周日北京时间 14:00（UTC 06:00）。
    - cron: "0 6 * * 0"

permissions:
  contents: write

concurrency:
  group: literature-radar
  cancel-in-progress: false

jobs:
  online-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install --disable-pip-version-check -e .

      - name: Run online source smoke tests
        env:
          RUN_ONLINE_TESTS: "1"
        run: python -m unittest discover -s tests -p "test_online_sources.py" -v

  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install --disable-pip-version-check -e .

      - name: Validate config
        run: python -m socdem_radar --config-dir config validate

      - name: Run offline tests
        run: python -m unittest discover -s tests -v

      - name: Run radar
        env:
          CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          MANUAL_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        shell: bash
        run: |
          args=()
          if [[ "$MANUAL_DRY_RUN" == "true" ]]; then
            args+=("--dry-run")
          fi
          python -m socdem_radar --config-dir config run "${args[@]}"

      - name: Add digest to job summary
        if: always()
        shell: bash
        run: |
          if [[ -f outputs/latest.md ]]; then
            cat outputs/latest.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload digest preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: literature-radar-preview
          path: |
            outputs/latest.md
            outputs/latest.html
            outputs/latest.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Persist deduplication state
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        shell: bash
        run: |
          if git diff --quiet -- data/state.json; then
            exit 0
          fi
          incoming_state="$RUNNER_TEMP/literature-radar-state.json"
          cp data/state.json "$incoming_state"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git commit -m "chore: update literature radar state"
          branch="${GITHUB_REF_NAME:-master}"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${branch}"; then
              exit 0
            fi
            echo "State push attempt ${attempt} failed; merging the latest remote state."
            git fetch origin "$branch"
            git reset --hard "origin/${branch}"
            python -m socdem_radar --config-dir config merge-state --incoming "$incoming_state"
            if git diff --quiet -- data/state.json; then
              exit 0
            fi
            git add data/state.json
            git commit -m "chore: merge literature radar state"
          done
          echo "Unable to persist literature radar state after 3 attempts." >&2
          exit 1
